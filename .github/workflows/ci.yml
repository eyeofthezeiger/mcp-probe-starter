name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, format check and typecheck
        run: npm run lint
      - name: Tests (fake in-process MCP server, local HTTP and stdio)
        run: npm test
      - name: Probe the bundled fake server end to end
        run: |
          cp probe.config.example.json probe.config.json
          npm run probe -- --only fake
          test -f out/registry/report.md
